<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>रिपोर्ट करें </title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">
      <div class="logo-icon">🌿</div>
      <span>Govt. Sandipani H.S.S Rajgarh</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">होम</a></li>
      <li><a href="report.html" class="active">रिपोर्ट करें</a></li>
      <li><a href="track.html">स्टेटस चेक</a></li>
      <li><a href="admin.html">एडमिन</a></li>
    </ul>
  </nav>

  <div class="container" style="padding-top: 2rem;">
    <h2 class="section-title">गंदगी रिपोर्ट करें</h2>
    <p class="section-subtitle">फोटो खींचें या अपलोड करें और विवरण भरें</p>

    <div class="form-card">
      <form id="reportForm">
        <!-- Camera / Photo Section -->
        <div class="form-group">
          <label>📷 गंदगी की फोटो *</label>
          <div class="camera-box" id="cameraBox">
            <video id="cameraPreview" playsinline></video>
            <img id="capturedPhoto" alt="Captured photo">
            <p id="cameraPlaceholder" style="color:#0f766e; margin:1rem 0;">
              कैमरा खोलें या फोटो चुनें
            </p>
            <div class="camera-controls">
              <button type="button" class="btn btn-primary btn-sm" id="startCameraBtn">📷 कैमरा खोलें</button>
              <button type="button" class="btn btn-success btn-sm" id="captureBtn" style="display:none;">📸 कैप्चर करें</button>
              <button type="button" class="btn btn-secondary btn-sm" id="retakeBtn" style="display:none;">🔄 दोबारा लें</button>
              <label class="btn btn-secondary btn-sm" style="cursor:pointer;">
                📁 फाइल चुनें
                <input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none;">
              </label>
            </div>
          </div>
          <input type="hidden" id="photoData" required>
        </div>

        <div class="form-group">
          <label for="location">📍 जगह / लोकेशन *</label>
          <input type="text" id="location" placeholder="जैसे: स्कूल गेट के पास, क्लास 10A के बाहर, प्लेग्राउंड..." required>
        </div>

        <div class="form-group">
          <label for="description">📝 विवरण (वैकल्पिक)</label>
          <textarea id="description" placeholder="जैसे: प्लास्टिक की बोतलें पड़ी हैं, पानी जमा है, कूड़ा फैला हुआ है..."></textarea>
        </div>

        <div class="form-group">
          <label for="reporterName">👤 आपका नाम (वैकल्पिक)</label>
          <input type="text" id="reporterName" placeholder="छात्र / कर्मचारी का नाम">
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; margin-top:0.5rem;">
          🚀 रिपोर्ट भेजें
        </button>
      </form>
    </div>
  </div>

  <footer>
    <p>🌿 स्वच्छ स्कूल पोर्टल • Clean School Initiative</p>
  </footer>

  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initReportPage();
    });
  </script>
</body>
</html>
